<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | Group Ride KC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    /* ── Logo / header ── */
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { width: 140px; height: auto; }
    h1 { color: #FFB81C; font-size: 1.4rem; text-align: center; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 0.82rem; text-align: center; margin-bottom: 28px; }

    /* ── Auth screen ── */
    #auth-screen {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 36px 28px;
      max-width: 400px;
      margin: 0 auto;
    }
    #auth-screen h2 { color: #FFB81C; margin-bottom: 18px; font-size: 1rem; }

    /* ── App screen ── */
    #app-screen { display: none; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
    }
    .toolbar input[type="text"] { flex: 1; min-width: 180px; }

    /* ── Filter chips ── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .chip {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      color: #aaa;
      font-size: 0.78rem;
      padding: 5px 14px;
      cursor: pointer;
      transition: all .15s;
      user-select: none;
    }
    .chip:hover { border-color: #FFB81C; color: #FFB81C; }
    .chip.active { background: #FFB81C; border-color: #FFB81C; color: #000; font-weight: bold; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .stat-pill {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 16px;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .stat-pill .num { font-size: 1.5rem; font-weight: 800; color: #FFB81C; }
    .stat-pill .lbl { font-size: 0.72rem; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

    /* ── Section label ── */
    .section-head {
      color: #555;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 10px;
    }

    /* ── Customer rows ── */
    .customer-row {
      background: #141414;
      border: 1px solid #222;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color .15s;
    }
    .customer-row:hover { border-color: #444; }

    .customer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .customer-avatar {
      width: 40px; height: 40px;
      background: #FFB81C;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; color: #000;
      flex-shrink: 0;
    }
    .customer-info { flex: 1; }
    .customer-name { font-weight: bold; font-size: 0.97rem; margin-bottom: 2px; }
    .customer-meta { color: #777; font-size: 0.78rem; }

    .customer-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .badge {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .badge-balance { background: rgba(255,184,28,.15); color: #FFB81C; border: 1px solid rgba(255,184,28,.35); }
    .badge-paid    { background: rgba(34,197,94,.12); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
    .badge-pending { background: rgba(156,163,175,.1); color: #9ca3af; border: 1px solid rgba(156,163,175,.25); }
    .badge-past    { background: rgba(107,114,128,.1); color: #6b7280; border: 1px solid rgba(107,114,128,.2); }
    .badge-count   { background: #1f1f1f; color: #888; border: 1px solid #333; }

    .chevron { color: #444; font-size: 1rem; transition: transform .2s; }
    .customer-row.open .chevron { transform: rotate(180deg); }

    /* ── Booking cards inside ── */
    .bookings-panel {
      display: none;
      padding: 0 14px 14px;
      border-top: 1px solid #1f1f1f;
    }
    .customer-row.open .bookings-panel { display: block; }

    .booking-card {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 10px;
    }
    .booking-card .bc-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .booking-card .bc-date { font-weight: bold; color: #FFB81C; font-size: 0.95rem; }
    .booking-card .bc-id  { color: #444; font-size: 0.7rem; font-family: monospace; }

    .bc-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 12px; }
    .bc-table td { padding: 4px 0; }
    .bc-table td:first-child { color: #666; width: 110px; }
    .bc-table td:last-child  { color: #ddd; }

    .balance-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .balance-pill.owed { background: rgba(255,184,28,.12); color: #FFB81C; border: 1px solid rgba(255,184,28,.35); }
    .balance-pill.zero { background: rgba(34,197,94,.1); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }

    .card-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .send-status { font-size: 0.8rem; color: #666; }
    .send-status.ok  { color: #22c55e; }
    .send-status.err { color: #E31837; }

    /* ── Shared form ── */
    label { display: block; color: #aaa; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.92rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #FFB81C; }

    .btn {
      background: #E31837;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-gold { background: #FFB81C; color: #000; }
    .btn-sm { padding: 7px 16px; font-size: 0.8rem; }
    .btn-ghost {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: #FFB81C; color: #FFB81C; }

    /* ── Notices ── */
    .notice {
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      color: #666;
      font-size: 0.87rem;
      padding: 20px;
      text-align: center;
    }
    .notice.error { border-color: rgba(227,24,55,.4); color: #E31837; }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #FFB81C;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <div class="logo">
    <img src="/images/grkc-logo-van.png" alt="Group Ride KC" />
  </div>
  <h1>Admin Dashboard</h1>
  <p class="subtitle">Group Ride KC · Balance Reminders &amp; Booking Management</p>

  <!-- ── Auth ── -->
  <div id="auth-screen">
    <h2>Admin Login</h2>
    <label for="pw-input">Password</label>
    <input type="password" id="pw-input" placeholder="Enter admin password" autocomplete="current-password" />
    <div style="margin-top:14px;">
      <button class="btn" onclick="login()">Log In</button>
    </div>
    <div id="auth-error" style="color:#E31837;font-size:.82rem;margin-top:10px;"></div>
  </div>

  <!-- ── App ── -->
  <div id="app-screen">

    <!-- Stats bar -->
    <div class="stats-bar" id="stats-bar" style="display:none;">
      <div class="stat-pill"><div class="num" id="stat-total">—</div><div class="lbl">Total Bookings</div></div>
      <div class="stat-pill"><div class="num" id="stat-balance" style="color:#FFB81C;">—</div><div class="lbl">Balance Owed</div></div>
      <div class="stat-pill"><div class="num" id="stat-paid" style="color:#22c55e;">—</div><div class="lbl">Paid in Full</div></div>
      <div class="stat-pill"><div class="num" id="stat-upcoming">—</div><div class="lbl">Upcoming</div></div>
    </div>

    <!-- Manual review request -->
    <div id="manual-review-wrap" style="margin-bottom:20px;">
      <div style="background:#141414;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;">
        <button onclick="toggleManualReview()"
          style="width:100%;background:none;border:none;color:#FFB81C;font-size:.85rem;font-weight:bold;padding:12px 18px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <span>★ Send Review Request to Unlisted Customer</span>
          <span id="manual-chevron" style="color:#555;font-size:1rem;">▾</span>
        </button>
        <div id="manual-review-form" style="display:none;padding:0 18px 18px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <div style="flex:1;min-width:150px;position:relative;">
              <label>Name</label>
              <input type="text" id="mr-name" placeholder="Jane Smith" autocomplete="off" oninput="mrNameSearch()" onblur="hideMrDropdown()" />
              <div id="mr-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#1a1a1a;border:1px solid #FFB81C;border-radius:0 0 8px 8px;z-index:50;max-height:180px;overflow-y:auto;"></div>
            </div>
            <div style="flex:1;min-width:150px;">
              <label>Phone</label>
              <input type="text" id="mr-phone" placeholder="(816) 555-1234" maxlength="14" oninput="formatMrPhone(this)" inputmode="numeric" />
            </div>
            <div style="flex:1;min-width:200px;">
              <label>Email</label>
              <input type="email" id="mr-email" placeholder="jane@email.com" />
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-sm" style="background:#FFB81C;color:#000;" id="mr-send-btn" onclick="sendManualReview()">Send Review Request</button>
            <span class="send-status" id="mr-status"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Reviews Inbox -->
    <div id="reviews-wrap" style="margin-bottom:20px;">
      <div style="background:#141414;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;">
        <button onclick="toggleReviews()"
          style="width:100%;background:none;border:none;color:#FFB81C;font-size:.85rem;font-weight:bold;padding:12px 18px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <span id="reviews-toggle-label">📋 Reviews Inbox</span>
          <span id="reviews-chevron" style="color:#555;font-size:1rem;">▾</span>
        </button>
        <div id="reviews-body" style="display:none;padding:0 18px 18px;">
          <div id="reviews-list"><span style="color:#555;font-size:.85rem;">Loading reviews…</span></div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search by name, phone, email, or booking ID…" />
      <button class="btn btn-gold" onclick="doSearch()">Search</button>
      <button class="btn-ghost" onclick="showDashboard()">All Bookings</button>
    </div>

    <!-- Filter chips -->
    <div class="filters" id="filter-chips">
      <div class="chip active" data-filter="all"     onclick="setFilter('all')">All</div>
      <div class="chip"        data-filter="balance"  onclick="setFilter('balance')">Balance Owed</div>
      <div class="chip"        data-filter="paid"     onclick="setFilter('paid')">Paid in Full</div>
      <div class="chip"        data-filter="upcoming" onclick="setFilter('upcoming')">Upcoming (7 days)</div>
      <div class="chip"        data-filter="unconfirmed" onclick="setFilter('unconfirmed')">Unconfirmed</div>
      <div class="chip"        data-filter="cancel_requested" onclick="setFilter('cancel_requested')">Cancel Requests</div>
      <div class="chip"        data-filter="past"     onclick="setFilter('past')">Past Rides</div>
    </div>

    <!-- Results -->
    <div id="results-label" class="section-head" style="display:none;"></div>
    <div id="results-wrap">
      <div class="notice"><span class="spinner"></span> Loading bookings…</div>
    </div>

  </div>
</div>

<!-- ── Cancel confirmation modal ── -->
<div id="cancel-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:28px 24px;max-width:440px;width:100%;">
    <h3 style="color:#E31837;margin-bottom:12px;">Confirm Cancellation</h3>
    <p id="cancel-modal-body" style="color:#ccc;font-size:.88rem;line-height:1.6;margin-bottom:8px;"></p>
    <p id="cancel-refund-note" style="color:#FFB81C;font-size:.85rem;font-weight:bold;margin-bottom:16px;"></p>
    <div style="display:flex;gap:10px;">
      <button class="btn-ghost" style="flex:1;" onclick="closeCancelModal()">Never Mind</button>
      <button class="btn" style="flex:1;" id="cancel-confirm-btn" onclick="doCancel()">Yes, Cancel Ride</button>
    </div>
    <div id="cancel-modal-status" style="margin-top:12px;font-size:.82rem;color:#aaa;"></div>
  </div>
</div>

<script>
  let SECRET = '';
  let ALL_BOOKINGS = [];
  let activeFilter = 'all';
  let searchMode = false;

  const FUNC = '/.netlify/functions/admin-reminder';

  document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('search-input') && document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  // ── Login ──
  function login() {
    const pw = document.getElementById('pw-input').value.trim();
    if (!pw) return;
    SECRET = pw;
    document.getElementById('auth-error').textContent = '';
    post({ action: 'list' })
      .then(data => {
        if (data.error === 'Unauthorized') {
          document.getElementById('auth-error').textContent = 'Incorrect password.';
          SECRET = '';
          return;
        }
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        ALL_BOOKINGS = data.bookings || [];
        renderStats(ALL_BOOKINGS);
        renderDashboard(ALL_BOOKINGS, activeFilter);
      })
      .catch(err => {
        document.getElementById('auth-error').textContent = 'Network error — try again.';
        SECRET = '';
      });
  }

  // ── Dashboard (grouped by customer) ──
  function showDashboard() {
    searchMode = false;
    document.getElementById('search-input').value = '';
    renderDashboard(ALL_BOOKINGS, activeFilter);
  }

  function setFilter(f) {
    activeFilter = f;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
    if (searchMode) return; // don't clobber search results — just update badge highlight
    renderDashboard(ALL_BOOKINGS, f);
  }

  function renderStats(bookings) {
    const today = todayStr();
    const total    = bookings.length;
    const balance  = bookings.filter(b => calcBalance(b) > 0).length;
    const paid     = bookings.filter(b => calcBalance(b) <= 0 && (b.payment_status === 'paid' || b.payment_status === 'deposit_paid')).length;
    const upcoming = bookings.filter(b => b.pickup_date >= today).length;

    document.getElementById('stat-total').textContent    = total;
    document.getElementById('stat-balance').textContent  = balance;
    document.getElementById('stat-paid').textContent     = paid;
    document.getElementById('stat-upcoming').textContent = upcoming;
    document.getElementById('stats-bar').style.display   = 'flex';
  }

  function renderDashboard(bookings, filter) {
    const today   = todayStr();
    const in7days = daysFromNow(7);

    // Apply filter
    let filtered = bookings.filter(b => {
      if (filter === 'balance')    return calcBalance(b) > 0;
      if (filter === 'paid')       return calcBalance(b) <= 0 && (b.payment_status === 'paid' || b.payment_status === 'deposit_paid');
      if (filter === 'upcoming')   return b.pickup_date >= today && b.pickup_date <= in7days;
      if (filter === 'unconfirmed')      return b.status === 'pending' || b.status === 'requested';
      if (filter === 'cancel_requested') return b.cancel_requested === true;
      if (filter === 'past')             return b.pickup_date < today;
      return true; // all
    });

    // Group by customer name (normalised)
    const groups = {};
    for (const b of filtered) {
      const key = (b.customer_name || 'Unknown').trim();
      if (!groups[key]) groups[key] = [];
      groups[key].push(b);
    }

    const label = document.getElementById('results-label');
    const wrap  = document.getElementById('results-wrap');
    const names = Object.keys(groups).sort();

    if (names.length === 0) {
      label.style.display = 'none';
      wrap.innerHTML = '<div class="notice">No bookings match this filter.</div>';
      return;
    }

    label.style.display = 'block';
    label.textContent   = `${names.length} customer${names.length !== 1 ? 's' : ''} · ${filtered.length} booking${filtered.length !== 1 ? 's' : ''}`;

    wrap.innerHTML = '';
    for (const name of names) {
      wrap.appendChild(buildCustomerRow(name, groups[name], today));
    }
  }

  function buildCustomerRow(name, bookings, today) {
    const initials   = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    const totalOwed  = bookings.reduce((s, b) => s + calcBalance(b), 0);
    const hasBalance = totalOwed > 0;
    const hasPast    = bookings.some(b => b.pickup_date < today);
    const hasFuture  = bookings.some(b => b.pickup_date >= today);
    const b0         = bookings[0];

    const row = document.createElement('div');
    row.className = 'customer-row';

    // Badge set
    let badges = '';
    if (hasBalance) badges += `<span class="badge badge-balance">Balance $${totalOwed.toFixed(2)}</span>`;
    else            badges += `<span class="badge badge-paid">Paid in Full</span>`;
    if (!hasFuture && hasPast) badges += `<span class="badge badge-past">Past</span>`;
    if (b0.status === 'pending' || b0.status === 'requested') badges += `<span class="badge badge-pending">Unconfirmed</span>`;
    if (bookings.some(b => b.cancel_requested)) badges += `<span class="badge" style="background:rgba(227,24,55,.15);color:#E31837;border:1px solid rgba(227,24,55,.35);">Cancel Request</span>`;
    if (bookings.length > 1) badges += `<span class="badge badge-count">${bookings.length} rides</span>`;

    const metaParts = [];
    if (b0.phone) metaParts.push(b0.phone);
    if (b0.email) metaParts.push(b0.email);

    row.innerHTML = `
      <div class="customer-header" onclick="toggleRow(this)">
        <div class="customer-avatar">${esc(initials)}</div>
        <div class="customer-info">
          <div class="customer-name">${esc(name)}</div>
          <div class="customer-meta">${esc(metaParts.join(' · '))}</div>
        </div>
        <div class="customer-badges">${badges}</div>
        <div class="chevron">▾</div>
      </div>
      <div class="bookings-panel" id="panel-${slugify(name)}"></div>
    `;

    // Populate booking cards into the panel
    const panel = row.querySelector('.bookings-panel');
    bookings
      .sort((a, b) => a.pickup_date > b.pickup_date ? 1 : -1)
      .forEach(b => panel.appendChild(buildBookingCard(b, today)));

    return row;
  }

  function toggleRow(header) {
    const row = header.closest('.customer-row');
    row.classList.toggle('open');
  }

  function buildBookingCard(b, today) {
    const total   = parseFloat(b.total_price) || 0;
    const paid    = actualPaid(b);
    const balance = Math.max(0, total - paid);
    const isPast  = b.pickup_date < today;
    const paidColor = paid > 0 ? '#22c55e' : '#888';

    const card = document.createElement('div');
    card.className = 'booking-card';
    card.id = `card-${b.id}`;

    card.innerHTML = `
      <div class="bc-head">
        <div>
          <div class="bc-date">${fmtDate(b.pickup_date)}${b.pickup_time ? ' at ' + fmtTime(b.pickup_time) : ''}${isPast ? ' <span style="color:#555;font-size:.75rem;font-weight:normal;">(past)</span>' : ''}</div>
          <div style="font-size:.72rem;color:#888;margin-top:2px;">Requested ${fmtCreatedAt(b.created_at)}</div>
        </div>
        <div class="bc-id">ID: ${esc(b.id)}</div>
      </div>

      <table class="bc-table">
        <tr><td>Pickup</td><td>${esc(b.pickup_address || 'N/A')}</td></tr>
        <tr><td>Drop-off</td><td>${esc(b.dropoff_address || 'N/A')}</td></tr>
        <tr><td>Passengers</td><td>${esc(b.passengers || 'N/A')}</td></tr>
        <tr><td>Status</td><td>${esc(b.status || 'N/A')} / ${esc(b.payment_status || 'N/A')}</td></tr>
        <tr><td>Total Due</td><td>$${total.toFixed(2)}</td></tr>
        <tr><td>Paid</td><td style="color:${paidColor};">$${paid.toFixed(2)}</td></tr>
      </table>

      <div class="balance-pill ${balance <= 0 ? 'zero' : 'owed'}">
        ${balance <= 0 ? '✓ Paid in full' : 'Balance due: $' + balance.toFixed(2)}
      </div>

      ${b.cancel_requested ? `
      <div style="background:rgba(227,24,55,.08);border:1px solid rgba(227,24,55,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.82rem;color:#E31837;">
        ⚠ Customer has requested cancellation
      </div>` : ''}

      <div class="card-actions">
        <button class="btn btn-sm" id="btn-${b.id}"
          onclick="sendReminder('${b.id}')"
          ${balance <= 0 ? 'disabled title="Balance is $0 — nothing to collect"' : ''}>
          Send Reminder
        </button>
        <button class="btn btn-sm" style="background:#1a1a1a;color:#FFB81C;border:1px solid #FFB81C;"
          id="review-btn-${b.id}"
          onclick="sendReview('${b.id}')">
          Send Review Request
        </button>
        <span class="send-status" id="review-status-${b.id}"></span>
        ${b.status !== 'cancelled' ? `
        <button class="btn btn-sm" style="background:#333;color:#ccc;border:1px solid #444;"
          id="cancel-btn-${b.id}"
          onclick="confirmCancel('${b.id}', '${esc(b.customer_name || '')}', '${esc(b.pickup_date || '')}', '${esc(b.pickup_time || '')}', ${balance})">
          Cancel Ride
        </button>` : `<span style="color:#E31837;font-size:.82rem;font-weight:bold;">Cancelled</span>`}
        <span class="send-status" id="status-${b.id}"></span>
      </div>
    `;
    return card;
  }

  // ── Search ──
  async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) { showDashboard(); return; }

    searchMode = true;
    const label = document.getElementById('results-label');
    const wrap  = document.getElementById('results-wrap');
    wrap.innerHTML = '<div class="notice"><span class="spinner"></span> Searching…</div>';
    label.style.display = 'none';

    try {
      const data = await post({ action: 'lookup', query: q });
      const bookings = data.bookings || [];
      const today = todayStr();

      if (bookings.length === 0) {
        wrap.innerHTML = '<div class="notice">No bookings found.</div>';
        return;
      }

      // Group by customer, same as dashboard
      const groups = {};
      for (const b of bookings) {
        const key = (b.customer_name || 'Unknown').trim();
        if (!groups[key]) groups[key] = [];
        groups[key].push(b);
      }

      const names = Object.keys(groups).sort();
      label.style.display = 'block';
      label.textContent = `${bookings.length} result${bookings.length !== 1 ? 's' : ''} for "${q}"`;
      wrap.innerHTML = '';
      for (const name of names) {
        const row = buildCustomerRow(name, groups[name], today);
        row.classList.add('open'); // auto-expand search results
        wrap.appendChild(row);
      }
    } catch (err) {
      wrap.innerHTML = `<div class="notice error">Error: ${esc(err.message)}</div>`;
    }
  }

  // ── Send reminder ──
  async function sendReminder(bookingId) {
    const btn    = document.getElementById(`btn-${bookingId}`);
    const status = document.getElementById(`status-${bookingId}`);

    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.className = 'send-status';

    try {
      const data = await post({ action: 'send', booking_id: bookingId });
      if (data.success) {
        const sms   = data.results?.sms   || '?';
        const email = data.results?.email || '?';
        const ok    = sms === 'sent' && email === 'sent';
        status.className = 'send-status ' + (ok ? 'ok' : 'err');
        status.textContent = `SMS: ${sms} · Email: ${email}`;
        btn.textContent = 'Sent!';
      } else {
        status.className = 'send-status err';
        status.textContent = data.error || 'Unknown error';
        btn.disabled = false;
        btn.textContent = 'Send Reminder';
      }
    } catch (err) {
      status.className = 'send-status err';
      status.textContent = `Network error: ${esc(err.message)}`;
      btn.disabled = false;
      btn.textContent = 'Send Reminder';
    }
  }

  // ── Manual review name autocomplete ──
  let mrSearchTimer = null;

  function mrNameSearch() {
    clearTimeout(mrSearchTimer);
    const q = document.getElementById('mr-name').value.trim();
    if (q.length < 2) { hideMrDropdown(); return; }

    // First check already-loaded bookings for instant results
    const matches = ALL_BOOKINGS.filter(b =>
      b.customer_name && b.customer_name.toLowerCase().includes(q.toLowerCase())
    );
    showMrDropdown(matches);

    // Also search server after short delay for bookings not in current list
    mrSearchTimer = setTimeout(async () => {
      try {
        const data = await post({ action: 'lookup', query: q });
        if (data.bookings?.length) showMrDropdown(data.bookings);
      } catch {}
    }, 350);
  }

  function showMrDropdown(bookings) {
    const dd = document.getElementById('mr-dropdown');
    if (!bookings.length) { hideMrDropdown(); return; }

    // Deduplicate by name+phone
    const seen = new Set();
    const unique = bookings.filter(b => {
      const key = `${b.customer_name}|${b.phone}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    dd.innerHTML = unique.slice(0, 6).map(b => `
      <div onmousedown="selectMrCustomer('${esc(b.customer_name||'')}','${esc(b.phone||'')}','${esc(b.email||'')}')"
        style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #2a2a2a;font-size:.85rem;"
        onmouseover="this.style.background='#2a2a2a'" onmouseout="this.style.background=''">
        <div style="color:#fff;font-weight:bold;">${esc(b.customer_name||'Unknown')}</div>
        <div style="color:#666;font-size:.78rem;">${esc(b.phone||'')}${b.phone && b.email ? ' · ' : ''}${esc(b.email||'')}</div>
      </div>`).join('');
    dd.style.display = 'block';
  }

  function selectMrCustomer(name, phone, email) {
    document.getElementById('mr-name').value  = name;
    document.getElementById('mr-email').value = email || '';
    // Format the phone when auto-filled
    const phoneEl = document.getElementById('mr-phone');
    phoneEl.value = phone || '';
    formatMrPhone(phoneEl);
    hideMrDropdown();
  }

  function hideMrDropdown() {
    setTimeout(() => { document.getElementById('mr-dropdown').style.display = 'none'; }, 150);
  }

  // ── Manual review (no booking) ──
  function formatMrPhone(input) {
    // Strip everything except digits
    let digits = input.value.replace(/\D/g, '').slice(0, 10);
    let formatted = '';
    if (digits.length > 0) formatted = '(' + digits.slice(0, 3);
    if (digits.length >= 4) formatted += ') ' + digits.slice(3, 6);
    if (digits.length >= 7) formatted += '-' + digits.slice(6, 10);
    input.value = formatted;
  }

  // ── Reviews Inbox ──
  let reviewsLoaded = false;

  function toggleReviews() {
    const body    = document.getElementById('reviews-body');
    const chevron = document.getElementById('reviews-chevron');
    const open    = body.style.display === 'none';
    body.style.display      = open ? 'block' : 'none';
    chevron.style.transform = open ? 'rotate(180deg)' : '';
    if (open && !reviewsLoaded) loadReviews();
  }

  async function loadReviews() {
    const listEl = document.getElementById('reviews-list');
    listEl.innerHTML = '<span style="color:#555;font-size:.85rem;"><span class="spinner"></span> Loading…</span>';
    try {
      const data = await post({ action: 'list_reviews' });
      const reviews = data.reviews || [];
      updateReviewsToggleLabel(reviews.length);
      if (!reviews.length) {
        listEl.innerHTML = '<p style="color:#555;font-size:.85rem;margin:12px 0;">No reviews yet.</p>';
        reviewsLoaded = true;
        return;
      }
      const avgRating = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
      let html = `
        <div style="display:flex;gap:12px;margin:12px 0 16px;flex-wrap:wrap;">
          <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 18px;text-align:center;">
            <div style="font-size:1.4rem;font-weight:800;color:#FFB81C;">${reviews.length}</div>
            <div style="font-size:.72rem;color:#666;text-transform:uppercase;letter-spacing:.05em;">Total Reviews</div>
          </div>
          <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 18px;text-align:center;">
            <div style="font-size:1.4rem;font-weight:800;color:#FFB81C;">${avgRating} ★</div>
            <div style="font-size:.72rem;color:#666;text-transform:uppercase;letter-spacing:.05em;">Avg Rating</div>
          </div>
        </div>`;
      reviews.forEach(r => {
        const stars   = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const date    = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
        const starColor = r.rating >= 4 ? '#FFB81C' : r.rating === 3 ? '#aaa' : '#E31837';
        html += `
        <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:4px;">
            <div>
              <span style="color:#fff;font-weight:bold;font-size:.92rem;">${esc(r.name)}</span>
              ${r.email ? `<span style="color:#555;font-size:.78rem;margin-left:8px;">${esc(r.email)}</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="color:${starColor};font-size:1rem;letter-spacing:2px;">${stars}</span>
              <span style="color:#555;font-size:.78rem;">${date}</span>
            </div>
          </div>
          <p style="color:#ccc;font-size:.88rem;line-height:1.6;margin:0;">${esc(r.review).replace(/\n/g, '<br>')}</p>
        </div>`;
      });
      listEl.innerHTML = html;
      reviewsLoaded = true;
    } catch (err) {
      listEl.innerHTML = `<p style="color:#E31837;font-size:.85rem;">Error loading reviews: ${esc(err.message)}</p>`;
    }
  }

  function updateReviewsToggleLabel(count) {
    const label = document.getElementById('reviews-toggle-label');
    if (label) label.textContent = `📋 Reviews Inbox${count ? ' (' + count + ')' : ''}`;
  }

  function toggleManualReview() {
    const form    = document.getElementById('manual-review-form');
    const chevron = document.getElementById('manual-chevron');
    const open    = form.style.display === 'none';
    form.style.display    = open ? 'block' : 'none';
    chevron.style.transform = open ? 'rotate(180deg)' : '';
  }

  async function sendManualReview() {
    const name   = document.getElementById('mr-name').value.trim();
    const phone  = document.getElementById('mr-phone').value.trim();
    const email  = document.getElementById('mr-email').value.trim();
    const btn    = document.getElementById('mr-send-btn');
    const status = document.getElementById('mr-status');

    if (!phone && !email) { status.className = 'send-status err'; status.textContent = 'Enter a phone or email.'; return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { status.className = 'send-status err'; status.textContent = 'Please enter a valid email address.'; return; }
    if (phone && phone.replace(/\D/g, '').length !== 10) { status.className = 'send-status err'; status.textContent = 'Phone must be a 10-digit number.'; return; }

    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.className = 'send-status';

    try {
      const data = await post({ action: 'send_review_manual', name, phone, email });
      if (data.success) {
        const sms      = data.results?.sms   || '?';
        const emailRes = data.results?.email || '?';
        const smsOk    = sms === 'sent' || sms.startsWith('skipped');
        const emailOk  = emailRes.startsWith('sent') || emailRes.startsWith('skipped');
        status.className = 'send-status ' + (smsOk && emailOk ? 'ok' : 'err');
        status.textContent = `SMS: ${sms} · Email: ${emailRes}`;
        btn.textContent = 'Sent!';
        // Clear fields
        document.getElementById('mr-name').value = '';
        document.getElementById('mr-phone').value = '';
        document.getElementById('mr-email').value = '';
      } else {
        status.className = 'send-status err';
        status.textContent = data.error || 'Unknown error';
        btn.disabled = false;
        btn.textContent = 'Send Review Request';
      }
    } catch (err) {
      status.className = 'send-status err';
      status.textContent = `Network error: ${esc(err.message)}`;
      btn.disabled = false;
      btn.textContent = 'Send Review Request';
    }
  }

  // ── Send review request ──
  async function sendReview(bookingId) {
    const btn    = document.getElementById(`review-btn-${bookingId}`);
    const status = document.getElementById(`review-status-${bookingId}`);
    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.className = 'send-status';

    try {
      const data = await post({ action: 'send_review', booking_id: bookingId });
      if (data.success) {
        const sms   = data.results?.sms   || '?';
        const email = data.results?.email || '?';
        const ok    = sms === 'sent' && email === 'sent';
        status.className = 'send-status ' + (ok ? 'ok' : 'err');
        status.textContent = `SMS: ${sms} · Email: ${email}`;
        btn.textContent = 'Sent!';
      } else {
        status.className = 'send-status err';
        status.textContent = data.error || 'Unknown error';
        btn.disabled = false;
        btn.textContent = 'Send Review Request';
      }
    } catch (err) {
      status.className = 'send-status err';
      status.textContent = `Network error: ${esc(err.message)}`;
      btn.disabled = false;
      btn.textContent = 'Send Review Request';
    }
  }

  // ── Cancel ride ──
  let cancelTargetId = null;

  function confirmCancel(bookingId, customerName, pickupDate, pickupTime, balance) {
    cancelTargetId = bookingId;
    const hoursUntil = pickupDate && pickupTime
      ? (new Date(`${pickupDate}T${pickupTime}:00Z`) - new Date()) / (1000 * 60 * 60)
      : 0;
    const deposit = parseFloat(ALL_BOOKINGS.find(b => b.id === bookingId)?.deposit_amount) || 0;

    document.getElementById('cancel-modal-body').textContent =
      `Cancel the ride for ${customerName} on ${fmtDate(pickupDate)} at ${fmtTime(pickupTime)}?`;

    const refundNote = hoursUntil > 72 && deposit > 0
      ? `Customer qualifies for a 50% deposit refund ($${(deposit * 0.5).toFixed(2)}) — will be issued automatically via Stripe.`
      : `Within 72-hour window — no refund will be issued per cancellation policy.`;
    document.getElementById('cancel-refund-note').textContent = refundNote;
    document.getElementById('cancel-modal-status').textContent = '';
    document.getElementById('cancel-modal').style.display = 'flex';
  }

  function closeCancelModal() {
    document.getElementById('cancel-modal').style.display = 'none';
    cancelTargetId = null;
  }

  async function doCancel() {
    if (!cancelTargetId) return;
    const btn = document.getElementById('cancel-confirm-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Cancelling…';
    document.getElementById('cancel-modal-status').textContent = '';

    try {
      const data = await post({ action: 'cancel', booking_id: cancelTargetId });
      if (data.success) {
        const refundStr = data.results?.refund ? ` · Refund: ${data.results.refund}` : '';
        document.getElementById('cancel-modal-status').style.color = '#22c55e';
        document.getElementById('cancel-modal-status').textContent =
          `Cancelled. SMS: ${data.results?.sms} · Email: ${data.results?.email}${refundStr}`;
        btn.textContent = 'Done';
        // Update local data and re-render
        const idx = ALL_BOOKINGS.findIndex(b => b.id === cancelTargetId);
        if (idx !== -1) { ALL_BOOKINGS[idx].status = 'cancelled'; ALL_BOOKINGS[idx].cancel_requested = false; }
        renderStats(ALL_BOOKINGS);
        // Close after short delay
        setTimeout(() => { closeCancelModal(); renderDashboard(ALL_BOOKINGS, activeFilter); }, 2500);
      } else {
        document.getElementById('cancel-modal-status').style.color = '#E31837';
        document.getElementById('cancel-modal-status').textContent = data.error || 'Something went wrong.';
        btn.disabled = false;
        btn.textContent = 'Yes, Cancel Ride';
      }
    } catch (err) {
      document.getElementById('cancel-modal-status').style.color = '#E31837';
      document.getElementById('cancel-modal-status').textContent = `Network error: ${err.message}`;
      btn.disabled = false;
      btn.textContent = 'Yes, Cancel Ride';
    }
  }

  // ── Helpers ──
  function post(payload) {
    return fetch(FUNC, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: SECRET, ...payload }),
    }).then(r => r.json());
  }

  // Actual amount paid, derived from payment_status.
  // payment_status values: 'pending' (nothing paid), 'deposit_paid', 'fully_paid'.
  function actualPaid(b) {
    const total   = parseFloat(b.total_price) || 0;
    const deposit = parseFloat(b.deposit_amount) || 0;
    if (b.payment_status === 'fully_paid') return total;
    if (b.payment_status === 'deposit_paid') return deposit;
    return 0;
  }

  function calcBalance(b) {
    const total = parseFloat(b.total_price) || 0;
    return Math.max(0, total - actualPaid(b));
  }

  // Format ISO timestamp as Central Time, e.g. "06/21/2026 at 11:53 AM"
  function fmtCreatedAt(iso) {
    if (!iso) return 'N/A';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString('en-US', {
      timeZone: 'America/Chicago',
      month: '2-digit', day: '2-digit', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true,
    }).replace(',', ' at');
  }

  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function daysFromNow(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function fmtDate(d) {
    if (!d) return 'N/A';
    const p = d.split('-');
    return p.length === 3 ? `${p[1]}/${p[2]}/${p[0]}` : d;
  }
  function fmtTime(t) {
    if (!t) return '';
    const p = t.split(':');
    let h = parseInt(p[0]);
    const m = p[1] || '00';
    const ampm = h >= 12 ? 'PM' : 'AM';
    if (h === 0) h = 12; else if (h > 12) h -= 12;
    return `${h}:${m} ${ampm}`;
  }
  function slugify(s) { return s.replace(/[^a-z0-9]/gi, '-').toLowerCase(); }
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
