<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Balance Reminders | Group Ride KC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo img {
      width: 160px;
      height: auto;
    }

    h1 {
      color: #FFB81C;
      font-size: 1.5rem;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 32px;
    }

    /* ── Auth screen ── */
    #auth-screen {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 36px 28px;
      max-width: 400px;
      margin: 0 auto;
    }

    #auth-screen h2 {
      color: #FFB81C;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    /* ── Main app ── */
    #app-screen { display: none; }

    /* ── Shared form elements ── */
    label {
      display: block;
      color: #aaa;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #FFB81C;
    }

    .btn {
      display: inline-block;
      background: #E31837;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity .2s;
    }

    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: default; }

    .btn-gold {
      background: #FFB81C;
      color: #000;
    }

    .btn-sm {
      padding: 8px 18px;
      font-size: 0.85rem;
    }

    /* ── Search bar ── */
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .search-row input { flex: 1; }

    /* ── Booking cards ── */
    #results { margin-top: 8px; }

    .booking-card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .booking-card .name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .booking-card .meta {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .booking-card .meta span {
      color: #fff;
    }

    .balance-pill {
      display: inline-block;
      background: rgba(255,184,28,.12);
      border: 1px solid rgba(255,184,28,.4);
      color: #FFB81C;
      font-weight: bold;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .balance-zero {
      background: rgba(34,197,94,.1);
      border-color: rgba(34,197,94,.3);
      color: #22c55e;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .send-status {
      font-size: 0.82rem;
      color: #aaa;
    }

    .send-status.ok { color: #22c55e; }
    .send-status.err { color: #E31837; }

    /* ── Notices ── */
    .notice {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      font-size: 0.9rem;
      padding: 16px;
      text-align: center;
    }

    .notice.error {
      border-color: rgba(227,24,55,.4);
      color: #E31837;
    }

    .section-head {
      color: #888;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="logo">
    <img src="/images/grkc-logo-van.png" alt="Group Ride KC" />
  </div>

  <h1>Balance Reminder Admin</h1>
  <p class="subtitle">Manually look up a booking and send the balance reminder.</p>

  <!-- ── Auth ── -->
  <div id="auth-screen">
    <h2>Admin Login</h2>
    <label for="pw-input">Admin Password</label>
    <input type="password" id="pw-input" placeholder="Enter password" autocomplete="current-password" />
    <div style="margin-top:16px;">
      <button class="btn" onclick="login()">Log In</button>
    </div>
    <div id="auth-error" style="color:#E31837;font-size:.85rem;margin-top:12px;"></div>
  </div>

  <!-- ── App ── -->
  <div id="app-screen">

    <div class="search-row">
      <input type="text" id="search-input" placeholder="Name, phone, email, or booking ID" />
      <button class="btn btn-gold" onclick="doSearch()">Search</button>
    </div>

    <div id="results-wrap">
      <p class="notice">Search above to find a booking.</p>
    </div>

  </div><!-- /app-screen -->

</div><!-- /container -->

<script>
  let SECRET = '';
  const FUNC = '/.netlify/functions/admin-reminder';

  // ── pw-input: allow Enter key ──
  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  document.getElementById('search-input') && document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  function login() {
    const pw = document.getElementById('pw-input').value.trim();
    if (!pw) return;
    SECRET = pw;
    // Quick auth ping — lookup with a dummy query to verify the secret
    fetch(FUNC, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: SECRET, action: 'lookup', query: 'ping-auth-check' }),
    })
      .then(r => r.json())
      .then(data => {
        if (data.error === 'Unauthorized') {
          document.getElementById('auth-error').textContent = 'Incorrect password.';
          SECRET = '';
        } else {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';
          document.getElementById('search-input').focus();
        }
      })
      .catch(() => {
        document.getElementById('auth-error').textContent = 'Network error — try again.';
        SECRET = '';
      });
  }

  async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    const wrap = document.getElementById('results-wrap');
    wrap.innerHTML = '<p class="notice">Searching...</p>';

    try {
      const res = await fetch(FUNC, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: SECRET, action: 'lookup', query: q }),
      });
      const data = await res.json();

      if (!data.bookings || data.bookings.length === 0) {
        wrap.innerHTML = '<p class="notice">No bookings found.</p>';
        return;
      }

      wrap.innerHTML = `<p class="section-head">${data.bookings.length} booking${data.bookings.length !== 1 ? 's' : ''} found</p>`;
      data.bookings.forEach(b => wrap.appendChild(buildCard(b)));

    } catch (err) {
      wrap.innerHTML = `<p class="notice error">Error: ${err.message}</p>`;
    }
  }

  function buildCard(b) {
    const total   = parseFloat(b.total_price) || 0;
    const deposit = parseFloat(b.deposit_amount) || 0;
    const balance = Math.max(0, total - deposit);

    const dateStr = b.pickup_date ? fmtDate(b.pickup_date) : 'N/A';
    const timeStr = b.pickup_time ? fmtTime(b.pickup_time) : '';

    const card = document.createElement('div');
    card.className = 'booking-card';
    card.id = `card-${b.id}`;

    card.innerHTML = `
      <div class="name">${esc(b.customer_name || 'Unknown')}</div>
      <div class="meta">
        <div>Date: <span>${dateStr}${timeStr ? ' at ' + timeStr : ''}</span></div>
        <div>Phone: <span>${esc(b.phone || 'N/A')}</span></div>
        <div>Email: <span>${esc(b.email || 'N/A')}</span></div>
        <div>Pickup: <span>${esc(b.pickup_address || 'N/A')}</span></div>
        <div>Drop-off: <span>${esc(b.dropoff_address || 'N/A')}</span></div>
        <div>Status: <span>${esc(b.status || 'N/A')} / ${esc(b.payment_status || 'N/A')}</span></div>
        <div>Total: <span>$${total.toFixed(2)}</span> &nbsp; Deposit: <span>$${deposit.toFixed(2)}</span></div>
      </div>
      <div class="balance-pill ${balance <= 0 ? 'balance-zero' : ''}">
        ${balance <= 0 ? 'Paid in full' : 'Balance due: $' + balance.toFixed(2)}
      </div>
      <div class="card-footer">
        <button class="btn btn-sm" onclick="sendReminder('${b.id}')" id="btn-${b.id}"
          ${balance <= 0 ? 'disabled title="Balance is already $0"' : ''}>
          Send Reminder
        </button>
        <span class="send-status" id="status-${b.id}"></span>
      </div>
    `;
    return card;
  }

  async function sendReminder(bookingId) {
    const btn    = document.getElementById(`btn-${bookingId}`);
    const status = document.getElementById(`status-${bookingId}`);

    btn.disabled = true;
    btn.textContent = 'Sending...';
    status.textContent = '';
    status.className = 'send-status';

    try {
      const res  = await fetch(FUNC, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: SECRET, action: 'send', booking_id: bookingId }),
      });
      const data = await res.json();

      if (data.success) {
        const sms   = data.results?.sms   || '?';
        const email = data.results?.email || '?';
        const smsOk   = sms   === 'sent';
        const emailOk = email === 'sent';
        const allOk   = smsOk && emailOk;

        status.className = 'send-status ' + (allOk ? 'ok' : 'err');
        status.textContent = `SMS: ${sms} | Email: ${email}`;
        btn.textContent = 'Sent!';
      } else {
        status.className = 'send-status err';
        status.textContent = data.error || 'Unknown error';
        btn.disabled = false;
        btn.textContent = 'Send Reminder';
      }
    } catch (err) {
      status.className = 'send-status err';
      status.textContent = `Network error: ${err.message}`;
      btn.disabled = false;
      btn.textContent = 'Send Reminder';
    }
  }

  // ── Helpers ──
  function fmtDate(d) {
    const p = d.split('-');
    return p.length === 3 ? `${p[1]}/${p[2]}/${p[0]}` : d;
  }

  function fmtTime(t) {
    const p = t.split(':');
    let h = parseInt(p[0]);
    const m = p[1] || '00';
    const ampm = h >= 12 ? 'PM' : 'AM';
    if (h === 0) h = 12;
    else if (h > 12) h -= 12;
    return `${h}:${m} ${ampm}`;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
